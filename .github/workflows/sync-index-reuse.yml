name: Sync generated index for ideal gas reuse

on:
  push:
    branches:
      - feature/ideal-gas-process-reuse-v1

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sync-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: feature/ideal-gas-process-reuse-v1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Regenerate exercise index
        run: python scripts/genera_indice.py

      - name: Commit generated index if needed
        run: |
          if git diff --quiet -- metadata/indice_esercizi.csv; then
            echo "Index already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metadata/indice_esercizi.csv
          git commit -m "chore: regenerate exercise index"
          git push origin HEAD:feature/ideal-gas-process-reuse-v1
