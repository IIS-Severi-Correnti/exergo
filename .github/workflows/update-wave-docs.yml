name: Update wave docs

on:
  push:
    branches:
      - feature/wave-1d-engine-v1
    paths:
      - .github/workflows/update-wave-docs.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/wave-1d-engine-v1
      - name: Update README and roadmap
        run: |
          python - <<'PY'
          from pathlib import Path

          readme = Path('simulazioni/README.md')
          text = readme.read_text(encoding='utf-8')
          old_tree = "|   |-- calorimetry/\n|   -- ray_optics/\n"
          new_tree = "|   |-- calorimetry/\n|   |-- ray_optics/\n|   -- wave_1d/\n"
          if old_tree not in text:
              raise SystemExit('README engine tree anchor missing')
          text = text.replace(old_tree, new_tree, 1)

          anchor = "## Associare una simulazione a un esercizio\n"
          section = '''### `wave_1d`\n\nServe tutti i cinque esercizi sulle onde presenti nell'archivio con cinque modelli:\n\n- `doppler_observer_moving`: osservatore mobile verso una sorgente ferma;\n- `doppler_source_moving`: sorgente mobile descritta tramite i rapporti adimensionali `v_s/v` e `f'/f`;\n- `string_mode`: frequenza fondamentale di una corda a lunghezza e tensione fissate, con `f/f0=1/sqrt(mu/mu0)`;\n- `mechanical_wave_energy`: misura normalizzata dell'energia tramite `E/Eref=(A/Aref)^2`;\n- `echo_time_of_flight`: principio del sonar con tempo normalizzato dell'intero viaggio di andata e ritorno.\n\nIl motore distingue le grandezze realmente disponibili dai casi solo qualitativi. `FIS-OND-DOP-001` usa i dati reali `960 Hz`, `+95 Hz`, `343 m/s`; `FIS-OND-DOP-002` resta interamente adimensionale e mostra il raddoppio a `v_s/v=0,5`. Per corda ed energia dell'onda si usano rapporti dichiaratamente illustrativi o normalizzati, senza trasformarli in misure dell'esercizio. Nel modello sonar, invece, il cursore rappresenta davvero `t/Delta t`: a metà tempo il segnale raggiunge l'ostacolo e al termine torna al sonar.\n\n'''
          if anchor not in text:
              raise SystemExit('README association anchor missing')
          text = text.replace(anchor, section + anchor, 1)
          text = text.replace('calorimetria, gas perfetti e ottica geometrica.', 'calorimetria, gas perfetti, ottica geometrica e onde.')
          text = text.replace('Exergo pubblica **32 esercizi di Fisica\ncon simulazione** attraverso **7 engine**.', 'Exergo pubblica **37 esercizi di Fisica\ncon simulazione** attraverso **8 engine**.')
          readme.write_text(text, encoding='utf-8')

          roadmap = Path('docs/SIMULATION_ROADMAP.md')
          text = roadmap.read_text(encoding='utf-8')
          text = text.replace('| `implemented` | 32 |', '| `implemented` | 37 |', 1)
          text = text.replace('| `planned` | 21 |', '| `planned` | 16 |', 1)
          active_anchor = '- `ray_optics` — 5 esercizi, 5 modelli.\n'
          if active_anchor not in text:
              raise SystemExit('roadmap active engine anchor missing')
          text = text.replace(active_anchor, active_anchor + '- `wave_1d` — 5 esercizi, 5 modelli.\n', 1)

          backlog_start = text.index('## Backlog dopo il completamento dell\'ottica geometrica')
          backlog_end = text.index('\n## `ideal_gas_process`: copertura corrente', backlog_start)
          backlog = '''## Backlog dopo il completamento delle onde\n\n| # | Engine | Tipo | Esercizi incrementali | Valore didattico | Complessità | Score | Ambito |\n|---:|---|---|---:|---:|---:|---:|---|\n| 1 | `newtonian_particle` | nuovo engine | 4 | 5 | 4 | 5.00 | Forze costanti 2D e piano inclinato con attrito |\n| 2 | `electrostatics_2d` | nuovo engine | 3 | 5 | 4 | 3.75 | Campo puntiforme, Coulomb e confronto inverse-square |\n| 3 | `magnetic_interaction_2d` | nuovo engine | 3 | 4 | 4 | 3.00 | Oersted, fili paralleli e forza di Lorentz |\n| 4 | `electromagnetic_induction` | nuovo engine | 2 | 5 | 4 | 2.50 | Faraday-Lenz e variazione di flusso |\n| 5 | `one_dimensional_collision` | estensione engine esistente | 1 | 5 | 2 | 2.50 | Urti elastici successivi tra più corpi |\n| 6 | `piecewise_mechanics` | orchestrazione composita | 2 | 5 | 5 | 2.00 | Problemi a fasi: dinamica/urto/molla |\n| 7 | `fluid_statics` | estensione engine attivo | 1 | 5 | 3 | 1.67 | Getti da fori a diversa profondità |\n| 8 | `thermal_expansion` | nuovo engine | 1 | 3 | 2 | 1.50 | Dilatazione termica dei solidi |\n| 9 | `momentum_system` | nuovo engine | 1 | 4 | 3 | 1.33 | Rinculo e sequenze di lanci |\n| 10 | `heat_engine` | nuovo engine | 1 | 4 | 3 | 1.33 | Rendimento e macchina di Carnot |\n'''
          text = text[:backlog_start] + backlog + text[backlog_end:]

          wave_section = '''\n## `wave_1d`: copertura corrente\n\nL'engine serve tutti i cinque esercizi sulle onde con cinque modelli e usa grandezze assolute soltanto quando il testo le fornisce.\n\n- `doppler_observer_moving` — `FIS-OND-DOP-001`: `f=960 Hz`, `f'=1055 Hz`, `v=343 m/s`, da cui `v_o≈33,94 m/s`. I fronti d'onda restano quelli di una sorgente ferma; cambia la velocità con cui l'osservatore li incontra.\n- `doppler_source_moving` — `FIS-OND-DOP-002`: il problema è risolto interamente con `beta=v_s/v`; `f'/f=1/(1-beta)` e il raddoppio richiede `beta=0,5`. Nessuna frequenza o velocità del suono assoluta viene inventata.\n- `string_mode` — `FIS-OND-COR-001`: a `L` e `T` costanti vale `f/f0=1/sqrt(mu/mu0)`. La configurazione usa una scala didattica `mu/mu0` da 1 a 4 solo per rendere visibile la dipendenza, senza attribuirla alle corde reali del quesito.\n- `mechanical_wave_energy` — `FIS-OND-MEC-001`: usa solo coordinate normalizzate `A/Aref` ed `E/Eref=(A/Aref)^2`, coerenti con `Emax=1/2 k A^2`; non vengono inventati `k`, ampiezza o periodo.\n- `echo_time_of_flight` — `FIS-OND-SUO-001`: il cursore è `t/Delta t` dell'intero viaggio; a 0,5 l'impulso raggiunge l'ostacolo e a 1 torna al sonar, visualizzando direttamente `2d=v Delta t`.\n\nLe viste distinguono fronti d'onda, modo fondamentale della corda, misura energetica con galleggiante e impulso sonar. Il playback non è tempo fisico nei modelli parametrico/normalizzati; lo è, in forma normalizzata, soltanto nel modello di tempo di volo.\n'''
          marker = '\n## `fluid_statics`: copertura corrente\n'
          if marker not in text:
              raise SystemExit('roadmap fluid anchor missing')
          text = text.replace(marker, wave_section + marker, 1)

          phase_completed = '- `ray_optics` per tutti i cinque esercizi di ottica attuali.\n'
          if phase_completed not in text:
              raise SystemExit('roadmap phase completed anchor missing')
          text = text.replace(phase_completed, phase_completed + '- `wave_1d` per tutti i cinque esercizi sulle onde attuali.\n', 1)
          text = text.replace('1. `wave_1d`;\n2. `newtonian_particle`;\n3. completare `fluid_statics` con `orifice_outflow`.', '1. `newtonian_particle`;\n2. completare `fluid_statics` con `orifice_outflow`.', 1)
          old_final = "Il traguardo **32/58** non conclude la roadmap: chiude però sia il dominio dei gas perfetti sia l'intero dominio di ottica geometrica presente oggi nell'archivio e sposta la priorità di Fase A verso onde e dinamica newtoniana."
          new_final = "Il traguardo **37/58** non conclude la roadmap: chiude i domini correnti di gas perfetti, ottica geometrica e onde e sposta la priorità di Fase A verso la dinamica newtoniana e il completamento della fluidostatica con il modello di efflusso."
          if old_final not in text:
              raise SystemExit('roadmap final checkpoint anchor missing')
          text = text.replace(old_final, new_final, 1)
          roadmap.write_text(text, encoding='utf-8')
          PY
      - name: Commit documentation
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add simulazioni/README.md docs/SIMULATION_ROADMAP.md
          git commit -m 'Document completed wave domain'
          git push origin HEAD:feature/wave-1d-engine-v1
