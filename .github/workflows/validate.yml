name: Validate archive

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Check Python syntax
        run: python -m py_compile scripts/*.py

      - name: Regenerate exercise index
        run: python scripts/genera_indice.py

      - name: Ensure generated index is committed
        run: git diff --exit-code metadata/indice_esercizi.csv

      - name: Validate exercise archive
        run: python scripts/valida_archivio.py

      - name: Run Python tests
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Run simulation engine tests
        run: node --test tests/js/*.test.mjs

      - name: Build static site for browser smoke test
        run: python scripts/genera_sito.py --output _site

      - name: Run simulation browser smoke test
        run: |
          set -euo pipefail
          command -v google-chrome
          mkdir -p browser-artifacts
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/exergo-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8765/tests/browser/simulation_smoke.html > /dev/null; then
              break
            fi
            sleep 0.25
          done

          google-chrome \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --virtual-time-budget=7000 \
            --dump-dom \
            http://127.0.0.1:8765/tests/browser/simulation_smoke.html \
            > browser-artifacts/smoke-dom.html

          grep -q 'data-status="PASS"' browser-artifacts/smoke-dom.html

          google-chrome \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --force-prefers-reduced-motion \
            --virtual-time-budget=7000 \
            --dump-dom \
            http://127.0.0.1:8765/tests/browser/simulation_smoke.html \
            > browser-artifacts/smoke-reduced-motion-dom.html

          grep -q 'data-status="PASS"' browser-artifacts/smoke-reduced-motion-dom.html

          google-chrome \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --window-size=430,3000 \
            --virtual-time-budget=7000 \
            --dump-dom \
            http://127.0.0.1:8765/tests/browser/simulation_smoke.html \
            > browser-artifacts/smoke-mobile-dom.html

          grep -q 'data-status="PASS"' browser-artifacts/smoke-mobile-dom.html

          google-chrome \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --virtual-time-budget=7000 \
            --dump-dom \
            http://127.0.0.1:8765/tests/browser/collision_smoke.html \
            > browser-artifacts/collision-dom.html

          grep -q 'data-status="PASS"' browser-artifacts/collision-dom.html

          google-chrome \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --force-prefers-reduced-motion \
            --virtual-time-budget=7000 \
            --dump-dom \
