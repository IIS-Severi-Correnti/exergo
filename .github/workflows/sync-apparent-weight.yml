name: Sync apparent-weight milestone

on:
  push:
    branches:
      - agent/fluid-statics-apparent-weight

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: agent/fluid-statics-apparent-weight

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Synchronize coverage roadmap and browser validation
        run: |
          python - <<'PY'
          from pathlib import Path

          coverage = Path("metadata/simulation_coverage.csv")
          text = coverage.read_text(encoding="utf-8")
          before = "FIS-FLU-ARC-002,planned,fluid_statics,buoyancy_apparent_weight,P0,"
          after = "FIS-FLU-ARC-002,implemented,fluid_statics,buoyancy_apparent_weight,P0,"
          if before not in text:
              raise SystemExit("coverage ARC-002 non trovata nello stato planned")
          coverage.write_text(text.replace(before, after, 1), encoding="utf-8")

          roadmap = Path("docs/SIMULATION_ROADMAP.md")
          text = roadmap.read_text(encoding="utf-8")
          replacements = {
              "| `implemented` | 9 |": "| `implemented` | 10 |",
              "| `planned` | 40 |": "| `planned` | 39 |",
              "- `fluid_statics` — 4 esercizi, modelli `hydrostatic_column` e `floating_body`.":
                  "- `fluid_statics` — 5 esercizi, modelli `hydrostatic_column`, `floating_body` e `buoyancy_apparent_weight`.",
              "## Backlog ordinato dopo `floating_body`": "## Backlog ordinato dopo `buoyancy_apparent_weight`",
              "| 1 | `fluid_statics` | estensione engine attivo | 5 | 5 | 3 | 8.33 | Peso apparente, Pascal, punti a diversa profondità, vasi comunicanti, getti |":
                  "| 1 | `fluid_statics` | estensione engine attivo | 4 | 5 | 3 | 6.67 | Pascal, punti a diversa profondità, vasi comunicanti, getti |",
              "Con il secondo modello, il manifest di `fluid_statics` usa varianti `oneOf`":
                  "Con più modelli, il manifest di `fluid_statics` usa varianti `oneOf`",
              "1. **`buoyancy_apparent_weight`** — `FIS-FLU-ARC-002`;\n2. `hydrostatic_pressure_points` — `FIS-FLU-PID-003`;\n3. `hydraulic_press` — `FIS-FLU-PAS-001`;\n4. `communicating_vessels` — `FIS-FLU-VAS-001`;\n5. `orifice_outflow` — `FIS-FLU-PID-004`, mantenuto separato dalla parte strettamente idrostatica perché introduce il moto del fluido.\n\nIl prossimo modello da implementare è **`buoyancy_apparent_weight`**: è ancora un caso di Archimede, quindi può riusare parte del linguaggio visuale appena stabilizzato, ma aggiunge un bilancio di forze con peso apparente e grandezze assolute fornite dal problema.":
                  "1. **`hydrostatic_pressure_points`** — `FIS-FLU-PID-003`;\n2. `hydraulic_press` — `FIS-FLU-PAS-001`;\n3. `communicating_vessels` — `FIS-FLU-VAS-001`;\n4. `orifice_outflow` — `FIS-FLU-PID-004`, mantenuto separato dalla parte strettamente idrostatica perché introduce il moto del fluido.\n\nIl prossimo modello da implementare è **`hydrostatic_pressure_points`**: riusa la legge di Stevino già validata ma introduce punti mobili nello stesso fluido, preparando il passaggio dai confronti tra colonne alla lettura locale della pressione."
          }
          for before_text, after_text in replacements.items():
              if before_text not in text:
                  raise SystemExit(f"roadmap replacement non trovato: {before_text[:80]}")
              text = text.replace(before_text, after_text, 1)

          marker = "Non vengono inventati massa o volume assoluti quando l'esercizio non li fornisce.\n\n"
          addition = """### `buoyancy_apparent_weight`\n\nCopre `FIS-FLU-ARC-002`. Il testo dell'esercizio rende ora espliciti `ρ_mare=1030 kg/m³` e `g=9,8 m/s²`, così dati e soluzione sono autosufficienti. Il modello usa le due letture del dinamometro per ricavare\n\n```text\nF_A = P - P_app\nV = F_A / (ρ_f g)\nm = P / g\nρ_c = m / V\n```\n\ne riusa internamente `floating_body` per descrivere la crescita della spinta con la frazione di volume immerso. La vista aggiunge il terzo vettore di forza, la tensione del dinamometro, e mantiene in ogni stato il bilancio quasi-statico `T + F_A = P`.\n\n"""
          if marker not in text:
              raise SystemExit("marker per sezione apparent weight non trovato")
          text = text.replace(marker, marker + addition, 1)
          roadmap.write_text(text, encoding="utf-8")

          workflow = Path(".github/workflows/validate.yml")
          text = workflow.read_text(encoding="utf-8")
          smoke_marker = "          grep -q 'data-status=\"PASS\"' browser-artifacts/fluid-statics-mobile-dom.html\n"
          smoke = r'''

          google-chrome \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --virtual-time-budget=7000 \
            --dump-dom \
            http://127.0.0.1:8765/tests/browser/apparent_weight_smoke.html \
            > browser-artifacts/apparent-weight-dom.html

          grep -q 'data-status="PASS"' browser-artifacts/apparent-weight-dom.html

          google-chrome \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --force-prefers-reduced-motion \
            --virtual-time-budget=7000 \
            --dump-dom \
            http://127.0.0.1:8765/tests/browser/apparent_weight_smoke.html \
            > browser-artifacts/apparent-weight-reduced-motion-dom.html

          grep -q 'data-status="PASS"' browser-artifacts/apparent-weight-reduced-motion-dom.html

          google-chrome \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --window-size=430,3000 \
            --virtual-time-budget=7000 \
            --dump-dom \
            http://127.0.0.1:8765/tests/browser/apparent_weight_smoke.html \
            > browser-artifacts/apparent-weight-mobile-dom.html

          grep -q 'data-status="PASS"' browser-artifacts/apparent-weight-mobile-dom.html
'''
          if "apparent-weight-dom.html" not in text:
              if smoke_marker not in text:
                  raise SystemExit("marker smoke fluid statics non trovato")
              text = text.replace(smoke_marker, smoke_marker + smoke, 1)

          screenshot_marker = "      - name: Upload simulation browser artifacts\n"
          screenshots = r'''          google-chrome \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --hide-scrollbars \
            --virtual-time-budget=2500 \
            --window-size=1440,2400 \
            --screenshot=browser-artifacts/apparent-weight-desktop.png \
            http://127.0.0.1:8765/_site/esercizi/fis-flu-arc-002/

          google-chrome \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --hide-scrollbars \
            --virtual-time-budget=2500 \
            --window-size=430,3000 \
            --screenshot=browser-artifacts/apparent-weight-mobile.png \
            http://127.0.0.1:8765/_site/esercizi/fis-flu-arc-002/

'''
          if "apparent-weight-desktop.png" not in text:
              if screenshot_marker not in text:
                  raise SystemExit("marker upload artifact non trovato")
              text = text.replace(screenshot_marker, screenshots + screenshot_marker, 1)
          workflow.write_text(text, encoding="utf-8")
          PY

      - name: Regenerate exercise index
        run: python scripts/genera_indice.py

      - name: Commit synchronized milestone files
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metadata/simulation_coverage.csv metadata/indice_esercizi.csv docs/SIMULATION_ROADMAP.md .github/workflows/validate.yml
          if git diff --cached --quiet; then
            echo "Milestone files already synchronized"
            exit 0
          fi
          git commit -m "chore: sync apparent-weight coverage roadmap and CI"
          git push origin HEAD:agent/fluid-statics-apparent-weight
