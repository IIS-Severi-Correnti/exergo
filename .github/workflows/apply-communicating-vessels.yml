name: Apply communicating-vessels milestone

on:
  push:
    branches:
      - agent/fluid-statics-communicating-vessels

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: agent/fluid-statics-communicating-vessels

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Apply deterministic milestone patch
        run: |
          python scripts/apply_communicating_vessels_milestone.py
          python scripts/genera_indice.py

      - name: Commit patched files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            esercizi/fisica/fluidostatica/vasi_comunicanti/FIS-FLU-VAS-001.tex \
            simulazioni/config/FIS-FLU-VAS-001.json \
            simulazioni/engines/fluid_statics/engine.js \
            simulazioni/engines/fluid_statics/manifest.json \
            simulazioni/engines/fluid_statics/multi_view.js \
            simulazioni/engines/fluid_statics/communicating_vessels_view.js \
            simulazioni/engines/fluid_statics/style.css \
            tests/js/fluid_statics_communicating_vessels.test.mjs \
            tests/test_communicating_vessels_config.py \
            tests/test_communicating_vessels_site.py \
            tests/test_fluid_statics_config.py \
            tests/test_site_generation.py \
            tests/browser/communicating_vessels_smoke.html \
            .github/workflows/validate.yml \
            metadata/indice_esercizi.csv \
            metadata/simulation_coverage.csv \
            docs/SIMULATION_ROADMAP.md
          git commit -m "feat: add communicating vessels model"
          git push origin HEAD:agent/fluid-statics-communicating-vessels
