<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <title>Exergo simulation smoke test</title>
  <link rel="stylesheet" href="../../_site/assets/style.css">
  <link rel="stylesheet" href="../../_site/assets/simulazioni/core/simulation.css">
  <link rel="stylesheet" href="../../_site/assets/simulazioni/engines/rotational_platform/style.css">
  <link rel="stylesheet" href="../../_site/assets/simulazioni/engines/ideal_gas_process/style.css">
</head>
<body>
  <main class="page">
    <p id="result">RUNNING</p>

    <section class="simulation-shell">
      <h2>Simulazione pilota</h2>
      <div id="pilot-simulation" data-exergo-simulation
        data-simulation-engine="rotational_platform"
        data-simulation-config="../../_site/assets/simulazioni/config/FIS-ROT-ANG-001.json">
        <p data-simulation-error hidden></p>
      </div>
    </section>

    <section class="simulation-shell">
      <h2>Simulazione di riuso</h2>
      <div id="reuse-simulation" data-exergo-simulation
        data-simulation-engine="rotational_platform"
        data-simulation-config="../../_site/assets/simulazioni/config/FIS-ROT-ANG-002.json">
        <p data-simulation-error hidden></p>
      </div>
    </section>

    <section class="simulation-shell">
      <h2>Trasformazione isoterma</h2>
      <div id="gas-simulation" data-exergo-simulation
        data-simulation-engine="ideal_gas_process"
        data-simulation-config="../../_site/assets/simulazioni/config/FIS-TER-GAS-003.json">
        <p data-simulation-error hidden></p>
      </div>
    </section>
  </main>

  <script type="module" src="../../_site/assets/simulazioni/core/runtime.js"></script>
  <script type="module">
    import { createSimulationEngine } from "../../_site/assets/simulazioni/engines/rotational_platform/engine.js";

    try {
      const engine = createSimulationEngine({
        schema_version: 1,
        engine: "rotational_platform",
        model: "textbook_reduced_system",
        parameters: {
          platform_mass_kg: 500,
          platform_radius_m: 2,
          participant_count: 10,
          participant_mass_kg: 65,
          participant_radius_m: 1.6,
          omega_initial_rad_s: 0.8,
          omega_target_rad_s: 0.98,
          omega_target_tolerance_rad_s: 0.01
        }
      });
      engine.removeParticipant();
      engine.removeParticipant();
      engine.removeParticipant();
      const state = engine.getState();
      const valid =
        state.participant_count_current === 7 &&
        Math.abs(state.total_moment_of_inertia_kg_m2 - 2164.8) < 1e-9 &&
        Math.abs(state.omega_rad_s - 2131.2 / 2164.8) < 1e-9;
      window.engineGeneralityCheck = valid ? "PASS" : "FAIL";
    } catch (error) {
      window.engineGeneralityCheck = "FAIL: " + error.message;
    }
  </script>

  <script>
    const result = document.querySelector("#result");
    const pilot = document.querySelector("#pilot-simulation");
    const reuse = document.querySelector("#reuse-simulation");
    const gas = document.querySelector("#gas-simulation");
    const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    function finish(status, details) {
      result.textContent = status + ": " + details;
      result.dataset.status = status;
      document.title = status + " - Exergo simulation smoke test";
    }

    function checkSimulation(simulation, expected) {
      const count = simulation.querySelector('[data-value="participant-count"]');
      const omega = simulation.querySelector('[data-value="omega"]');
      const remove = simulation.querySelector('[data-simulation-action="remove_participant"]');
      const reset = simulation.querySelector('[data-simulation-action="reset"]');
      const countLabel = simulation.querySelector('[data-participant-count-label]');
      const learningAction = simulation.querySelector('[data-learning-action]');
      const participantLayer = simulation.querySelector("[data-platform-participants]");
      const initialParticipants = Array.from(participantLayer.children);
      const initialTransforms = initialParticipants.map((node) => node.getAttribute("transform"));

      if (count.textContent !== String(expected.initialCount)) throw new Error(expected.name + ": conteggio iniziale");
      if (countLabel.textContent !== expected.countLabel) throw new Error(expected.name + ": etichetta conteggio");
      if (remove.textContent !== expected.removeLabel) throw new Error(expected.name + ": etichetta azione");
      if (!learningAction.textContent.includes(expected.learningKeyword)) throw new Error(expected.name + ": istruzione didattica");

      for (let index = 0; index < expected.removals; index += 1) {
        remove.click();
      }

      const remaining = expected.initialCount - expected.removals;
      if (count.textContent !== String(remaining)) throw new Error(expected.name + ": rimozione");
      if (simulation.dataset.targetReached !== "true") throw new Error(expected.name + ": obiettivo");
      if (!omega.textContent.startsWith(expected.omegaPrefix)) throw new Error(expected.name + ": omega");

      const participantsAfterRemoval = Array.from(participantLayer.children);
      if (participantsAfterRemoval.length !== expected.initialCount) {
        throw new Error(expected.name + ": slot iniziali non preservati");
      }
      for (let index = 0; index < remaining; index += 1) {
        if (participantsAfterRemoval[index].getAttribute("transform") !== initialTransforms[index]) {
          throw new Error(expected.name + ": partecipante rimasto spostato");
        }
        if (participantsAfterRemoval[index].getAttribute("display") === "none") {
          throw new Error(expected.name + ": partecipante rimasto nascosto");
        }
      }
      for (let index = remaining; index < expected.initialCount; index += 1) {
        if (participantsAfterRemoval[index].getAttribute("display") !== "none") {
          throw new Error(expected.name + ": slot uscito ancora visibile");
        }
      }

      reset.click();
      if (count.textContent !== String(expected.initialCount)) throw new Error(expected.name + ": reset conteggio");
      if (simulation.dataset.targetReached !== "false") throw new Error(expected.name + ": reset obiettivo");
    }

    function checkGasSimulation() {
      const slider = gas.querySelector('[data-simulation-action="set_progress"]');
      const play = gas.querySelector('[data-simulation-action="play"]');
      const pause = gas.querySelector('[data-simulation-action="pause"]');
      const reset = gas.querySelector('[data-simulation-action="reset"]');
      const heat = gas.querySelector('[data-value="heat"]');
      const deltaU = gas.querySelector('[data-value="delta-u"]');
      const gasFill = gas.querySelector("[data-gas-fill]");
      const statePoint = gas.querySelector("[data-state-point]");
      const workArea = gas.querySelector("[data-work-area]");
      const initialFillWidth = Number(gasFill.getAttribute("width"));
      const initialPointX = Number(statePoint.getAttribute("cx"));
      const initialPointY = Number(statePoint.getAttribute("cy"));
      const initialWorkArea = workArea.getAttribute("d");

      if (Math.abs(Number(gas.dataset.volumeM3) - 0.20) > 1e-12) throw new Error("gas: volume iniziale");
      if (Math.abs(Number(gas.dataset.pressurePa) - 3741.5081781689573) > 1e-6) throw new Error("gas: pressione iniziale");
      if (Number(gas.dataset.heatJ) !== 0) throw new Error("gas: calore iniziale");
      if (slider.disabled) throw new Error("gas: slider disabilitato");
      if (play.disabled !== reducedMotion) throw new Error("gas: semantica Play e reduced motion");
      if (!pause.disabled) throw new Error("gas: Pausa iniziale");

      slider.value = "500";
      slider.dispatchEvent(new Event("input", { bubbles: true }));
      if (Math.abs(Number(gas.dataset.volumeM3) - 0.275) > 1e-12) throw new Error("gas: scrubbing intermedio");

      slider.value = "1000";
      slider.dispatchEvent(new Event("input", { bubbles: true }));
      if (Math.abs(Number(gas.dataset.volumeM3) - 0.35) > 1e-12) throw new Error("gas: volume finale");
      if (Math.abs(Number(gas.dataset.pressurePa) - 2138.0046732394044) > 1e-6) throw new Error("gas: pressione finale");
      if (Math.abs(Number(gas.dataset.heatJ) - 418.76140943856973) > 0.05) throw new Error("gas: Q finale");
      if (Number(gas.dataset.deltaUJ) !== 0 || deltaU.textContent !== "0") throw new Error("gas: Delta U");
      if (gas.dataset.complete !== "true") throw new Error("gas: completamento");
      if (!heat.textContent.startsWith("418,8")) throw new Error("gas: presentazione Q finale");
      if (Math.abs(Number(gasFill.getAttribute("width")) / initialFillWidth - 1.75) > 1e-9) {
        throw new Error("gas: pistone non proporzionale al volume");
      }
      if (Number(statePoint.getAttribute("cx")) <= initialPointX) throw new Error("gas: punto p-V non avanza");
      if (Number(statePoint.getAttribute("cy")) <= initialPointY) throw new Error("gas: punto p-V non scende");
      if (workArea.getAttribute("d") === initialWorkArea) throw new Error("gas: area del lavoro non aggiornata");

      reset.click();
      if (Math.abs(Number(gas.dataset.volumeM3) - 0.20) > 1e-12) throw new Error("gas: reset volume");
      if (Number(gas.dataset.heatJ) !== 0) throw new Error("gas: reset calore");
      if (slider.value !== "0") throw new Error("gas: reset slider");
      if (gas.dataset.complete !== "false") throw new Error("gas: reset completamento");
    }

    const deadline = Date.now() + 5000;
    const checkReady = window.setInterval(() => {
      if (
        pilot?.dataset.simulationReady !== "true" ||
        reuse?.dataset.simulationReady !== "true" ||
        gas?.dataset.simulationReady !== "true" ||
        window.engineGeneralityCheck === undefined
      ) {
        if (Date.now() > deadline) {
          window.clearInterval(checkReady);
          finish("FAIL", "inizializzazione scaduta");
        }
        return;
      }

      window.clearInterval(checkReady);
      try {
        if (window.engineGeneralityCheck !== "PASS") {
          throw new Error("configurazione alternativa: " + window.engineGeneralityCheck);
        }

        const play = pilot.querySelector('[data-simulation-action="play"]');
        const pause = pilot.querySelector('[data-simulation-action="pause"]');
        if (play.disabled !== reducedMotion) {
          throw new Error("rotazionale: semantica Play e reduced motion");
        }
        if (!reducedMotion) {
          play.click();
          pause.click();
        }

        checkSimulation(pilot, {
          name: "pilota",
          initialCount: 6,
          removals: 2,
          countLabel: "Ragazze rimaste",
          removeLabel: "Una ragazza salta",
          learningKeyword: "ragazza",
          omegaPrefix: "2,331"
        });

        checkSimulation(reuse, {
          name: "riuso",
          initialCount: 8,
          removals: 2,
          countLabel: "Studenti rimasti",
          removeLabel: "Uno studente scende",
          learningKeyword: "studente",
          omegaPrefix: "1,205"
        });

        checkGasSimulation();

        if (document.documentElement.scrollWidth > window.innerWidth + 1) {
          throw new Error(
            "layout: overflow orizzontale " +
            document.documentElement.scrollWidth +
            "px su viewport " +
            window.innerWidth +
            "px"
          );
        }

        finish(
          "PASS",
          "due motori, due esercizi rotazionali, gas con slider/Q/Delta U/reset, reduced motion=" + reducedMotion
        );
      } catch (error) {
        finish("FAIL", error.message);
      }
    }, 25);
  </script>
</body>
</html>
