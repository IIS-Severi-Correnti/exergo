name: Integrate wave QA

on:
  push:
    branches:
      - feature/wave-1d-engine-v1
    paths:
      - .github/workflows/integrate-wave-qa.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/wave-1d-engine-v1
      - name: Extend static-site and browser QA
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/test_site_generation.py')
          text = path.read_text(encoding='utf-8')
          anchor = '''OPTICS_IDS = (\n    "FIS-OTT-RFL-001",\n    "FIS-OTT-RIF-001",\n    "FIS-OTT-RIF-002",\n    "FIS-OTT-RIF-003",\n    "FIS-OTT-SPE-001",\n)\n'''
          wave = anchor + '''WAVE_IDS = (\n    "FIS-OND-DOP-001",\n    "FIS-OND-DOP-002",\n    "FIS-OND-COR-001",\n    "FIS-OND-MEC-001",\n    "FIS-OND-SUO-001",\n)\n'''
          if anchor not in text: raise SystemExit('OPTICS_IDS anchor missing')
          text = text.replace(anchor, wave, 1)

          anchor = '        cls.optics_exercises = tuple(by_id[exercise_id] for exercise_id in OPTICS_IDS)\n'
          if anchor not in text: raise SystemExit('optics setUp anchor missing')
          text = text.replace(anchor, anchor + '        cls.wave_exercises = tuple(by_id[exercise_id] for exercise_id in WAVE_IDS)\n', 1)

          anchor = '''    def test_all_five_optics_exercises_share_ray_optics_engine(self) -> None:\n        for exercise in self.optics_exercises:\n            with self.subTest(exercise=exercise.exercise_id):\n                page = genera_sito.render_exercise_page(exercise)\n                self.assertIn('data-simulation-engine="ray_optics"', page)\n                self.assertIn("engines/ray_optics/style.css", page)\n                self.assertLess(page.index(">Simulazione</h2>"), page.index("<summary>Soluzione</summary>"))\n\n'''
          addition = anchor + '''    def test_all_five_wave_exercises_share_wave_engine(self) -> None:\n        for exercise in self.wave_exercises:\n            with self.subTest(exercise=exercise.exercise_id):\n                page = genera_sito.render_exercise_page(exercise)\n                self.assertIn('data-simulation-engine="wave_1d"', page)\n                self.assertIn("engines/wave_1d/style.css", page)\n                self.assertLess(page.index(">Simulazione</h2>"), page.index("<summary>Soluzione</summary>"))\n\n'''
          if anchor not in text: raise SystemExit('optics page test anchor missing')
          text = text.replace(anchor, addition, 1)
          text = text.replace('def test_site_contains_seven_engines_and_thirty_two_configs', 'def test_site_contains_eight_engines_and_thirty_seven_configs', 1)

          anchor = '                "engines/ray_optics/engine.js", "engines/ray_optics/view.js", "engines/ray_optics/style.css",\n'
          if anchor not in text: raise SystemExit('ray asset anchor missing')
          text = text.replace(anchor, anchor + '                "engines/wave_1d/engine.js", "engines/wave_1d/view.js", "engines/wave_1d/style.css",\n', 1)

          anchor = '                *DC_EXPANSION_IDS, *CALORIMETRY_EXPANSION_IDS, *OPTICS_IDS,\n'
          if anchor not in text: raise SystemExit('simulated ids anchor missing')
          text = text.replace(anchor, '                *DC_EXPANSION_IDS, *CALORIMETRY_EXPANSION_IDS, *OPTICS_IDS, *WAVE_IDS,\n', 1)

          anchor = '''    def test_ray_optics_subset_is_self_contained(self) -> None:\n        actual_assets = self._asset_set(self.optics_exercises)\n        for asset in ("engines/ray_optics/engine.js", "engines/ray_optics/view.js", "engines/ray_optics/style.css"):\n            self.assertIn(asset, actual_assets)\n        for exercise_id in OPTICS_IDS:\n            self.assertIn(f"config/{exercise_id}.json", actual_assets)\n        for other_engine in ("ideal_gas_process", "fluid_statics", "dc_circuit", "calorimetry", "rotational_platform", "one_dimensional_collision"):\n            self.assertFalse(any(path.startswith(f"engines/{other_engine}/") for path in actual_assets))\n'''
          replacement = '''    def test_ray_optics_subset_is_self_contained(self) -> None:\n        actual_assets = self._asset_set(self.optics_exercises)\n        for asset in ("engines/ray_optics/engine.js", "engines/ray_optics/view.js", "engines/ray_optics/style.css"):\n            self.assertIn(asset, actual_assets)\n        for exercise_id in OPTICS_IDS:\n            self.assertIn(f"config/{exercise_id}.json", actual_assets)\n        for other_engine in ("ideal_gas_process", "fluid_statics", "dc_circuit", "calorimetry", "rotational_platform", "one_dimensional_collision", "wave_1d"):\n            self.assertFalse(any(path.startswith(f"engines/{other_engine}/") for path in actual_assets))\n\n    def test_wave_subset_is_self_contained(self) -> None:\n        actual_assets = self._asset_set(self.wave_exercises)\n        for asset in ("engines/wave_1d/engine.js", "engines/wave_1d/view.js", "engines/wave_1d/style.css"):\n            self.assertIn(asset, actual_assets)\n        for exercise_id in WAVE_IDS:\n            self.assertIn(f"config/{exercise_id}.json", actual_assets)\n        for other_engine in ("ideal_gas_process", "fluid_statics", "dc_circuit", "calorimetry", "rotational_platform", "one_dimensional_collision", "ray_optics"):\n            self.assertFalse(any(path.startswith(f"engines/{other_engine}/") for path in actual_assets))\n'''
          if anchor not in text: raise SystemExit('ray subset anchor missing')
          text = text.replace(anchor, replacement, 1)
          path.write_text(text, encoding='utf-8')

          path = Path('.github/workflows/validate-expansion-browser.yml')
          text = path.read_text(encoding='utf-8')
          old = '          for smoke in expansion_smoke gas_expansion_smoke ray_optics_smoke; do\n'
          new = '          for smoke in expansion_smoke gas_expansion_smoke ray_optics_smoke wave_smoke; do\n'
          if old not in text: raise SystemExit('browser smoke loop anchor missing')
          text = text.replace(old, new, 1)
          anchor = '''          google-chrome --headless=new --no-sandbox --disable-gpu --hide-scrollbars \\\n            --virtual-time-budget=2500 --window-size=430,3300 \\\n            --screenshot=expansion-browser-artifacts/fis-ott-spe-001-mobile.png \\\n            http://127.0.0.1:8765/_site/esercizi/fis-ott-spe-001/\n'''
          addition = anchor + '''\n          for route in fis-ond-dop-001 fis-ond-dop-002 fis-ond-cor-001 fis-ond-mec-001 fis-ond-suo-001; do\n            google-chrome --headless=new --no-sandbox --disable-gpu --hide-scrollbars \\\n              --virtual-time-budget=2500 --window-size=1440,2500 \\\n              --screenshot="expansion-browser-artifacts/${route}-desktop.png" \\\n              "http://127.0.0.1:8765/_site/esercizi/${route}/"\n          done\n          google-chrome --headless=new --no-sandbox --disable-gpu --hide-scrollbars \\\n            --virtual-time-budget=2500 --window-size=430,3300 \\\n            --screenshot=expansion-browser-artifacts/fis-ond-dop-002-mobile.png \\\n            http://127.0.0.1:8765/_site/esercizi/fis-ond-dop-002/\n          google-chrome --headless=new --no-sandbox --disable-gpu --hide-scrollbars \\\n            --virtual-time-budget=2500 --window-size=430,3300 \\\n            --screenshot=expansion-browser-artifacts/fis-ond-suo-001-mobile.png \\\n            http://127.0.0.1:8765/_site/esercizi/fis-ond-suo-001/\n'''
          if anchor not in text: raise SystemExit('optics screenshot anchor missing')
          text = text.replace(anchor, addition, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Remove workflow and commit
        run: |
          set -euo pipefail
          rm .github/workflows/integrate-wave-qa.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/integrate-wave-qa.yml .github/workflows/validate-expansion-browser.yml tests/test_site_generation.py
          git commit -m 'Integrate wave engine into static and browser QA'
          git push origin HEAD:feature/wave-1d-engine-v1
