name: Canonicalize communicating-vessels zero

on:
  push:
    branches:
      - agent/fluid-statics-communicating-vessels

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/fluid-statics-communicating-vessels
      - name: Canonicalize final offsets
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('simulazioni/engines/fluid_statics/engine.js')
          text = path.read_text(encoding='utf-8')
          old = '        pattern.map((value) => value * imbalanceFraction),'
          new = '        pattern.map((value) => (imbalanceFraction === 0 ? 0 : value * imbalanceFraction)),'
          if text.count(old) != 1:
              raise SystemExit('expected one communicating-vessels mapping')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add simulazioni/engines/fluid_statics/engine.js
          git commit -m "fix: canonicalize communicating-vessels equilibrium zero"
          git push origin HEAD:agent/fluid-statics-communicating-vessels
