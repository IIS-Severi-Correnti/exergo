name: Validate expanded simulations browser

on:
  push:
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Build static site
        run: python scripts/genera_sito.py --output _site
      - name: Exercise expansion simulations in Chrome
        run: |
          set -euo pipefail
          command -v google-chrome
          mkdir -p expansion-browser-artifacts
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/exergo-expansion-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8765/tests/browser/expansion_smoke.html > /dev/null; then
              break
            fi
            sleep 0.25
          done

          for smoke in expansion_smoke gas_expansion_smoke ray_optics_smoke; do
            google-chrome --headless=new --no-sandbox --disable-gpu \
              --virtual-time-budget=10000 --dump-dom \
              "http://127.0.0.1:8765/tests/browser/${smoke}.html" \
              > "expansion-browser-artifacts/${smoke}-dom.html"
            grep -q 'data-status="PASS"' "expansion-browser-artifacts/${smoke}-dom.html"

            google-chrome --headless=new --no-sandbox --disable-gpu \
              --force-prefers-reduced-motion --virtual-time-budget=10000 --dump-dom \
              "http://127.0.0.1:8765/tests/browser/${smoke}.html" \
              > "expansion-browser-artifacts/${smoke}-reduced-motion-dom.html"
            grep -q 'data-status="PASS"' "expansion-browser-artifacts/${smoke}-reduced-motion-dom.html"

            google-chrome --headless=new --no-sandbox --disable-gpu \
              --window-size=430,12000 --virtual-time-budget=10000 --dump-dom \
              "http://127.0.0.1:8765/tests/browser/${smoke}.html" \
              > "expansion-browser-artifacts/${smoke}-mobile-dom.html"
            grep -q 'data-status="PASS"' "expansion-browser-artifacts/${smoke}-mobile-dom.html"
          done

          google-chrome --headless=new --no-sandbox --disable-gpu --hide-scrollbars \
            --virtual-time-budget=2500 --window-size=1440,2300 \
            --screenshot=expansion-browser-artifacts/circuit-ohm-desktop.png \
            http://127.0.0.1:8765/_site/esercizi/fis-cir-ohm-002/
          google-chrome --headless=new --no-sandbox --disable-gpu --hide-scrollbars \
            --virtual-time-budget=2500 --window-size=430,3000 \
            --screenshot=expansion-browser-artifacts/circuit-ohm-mobile.png \
            http://127.0.0.1:8765/_site/esercizi/fis-cir-ohm-002/

          google-chrome --headless=new --no-sandbox --disable-gpu --hide-scrollbars \
            --virtual-time-budget=2500 --window-size=1440,2400 \
            --screenshot=expansion-browser-artifacts/calorimetry-ice-desktop.png \
            http://127.0.0.1:8765/_site/esercizi/fis-ter-eq-002/
          google-chrome --headless=new --no-sandbox --disable-gpu --hide-scrollbars \
            --virtual-time-budget=2500 --window-size=430,3000 \
            --screenshot=expansion-browser-artifacts/calorimetry-ice-mobile.png \
            http://127.0.0.1:8765/_site/esercizi/fis-ter-eq-002/
          google-chrome --headless=new --no-sandbox --disable-gpu --hide-scrollbars \
            --virtual-time-budget=2500 --window-size=1440,2300 \
            --screenshot=expansion-browser-artifacts/calorimetry-specific-heat-desktop.png \
            http://127.0.0.1:8765/_site/esercizi/fis-ter-cal-001/
          google-chrome --headless=new --no-sandbox --disable-gpu --hide-scrollbars \
            --virtual-time-budget=2500 --window-size=1440,2400 \
            --screenshot=expansion-browser-artifacts/calorimetry-phase-change-desktop.png \
            http://127.0.0.1:8765/_site/esercizi/fis-ter-pas-001/

          google-chrome --headless=new --no-sandbox --disable-gpu --hide-scrollbars \
            --virtual-time-budget=2500 --window-size=1440,2600 \
            --screenshot=expansion-browser-artifacts/gas-comparison-desktop.png \
            http://127.0.0.1:8765/_site/esercizi/fis-ter-gas-001/
          google-chrome --headless=new --no-sandbox --disable-gpu --hide-scrollbars \
            --virtual-time-budget=2500 --window-size=430,3400 \
            --screenshot=expansion-browser-artifacts/gas-comparison-mobile.png \
            http://127.0.0.1:8765/_site/esercizi/fis-ter-gas-001/
          google-chrome --headless=new --no-sandbox --disable-gpu --hide-scrollbars \
            --virtual-time-budget=2500 --window-size=1440,2600 \
            --screenshot=expansion-browser-artifacts/gas-piecewise-desktop.png \
            http://127.0.0.1:8765/_site/esercizi/fis-ter-gas-002/
          google-chrome --headless=new --no-sandbox --disable-gpu --hide-scrollbars \
            --virtual-time-budget=2500 --window-size=1440,2300 \
            --screenshot=expansion-browser-artifacts/gas-cycle-desktop.png \
            http://127.0.0.1:8765/_site/esercizi/fis-ter-gas-004/
          google-chrome --headless=new --no-sandbox --disable-gpu --hide-scrollbars \
            --virtual-time-budget=2500 --window-size=1440,2500 \
            --screenshot=expansion-browser-artifacts/gas-isochoric-desktop.png \
            http://127.0.0.1:8765/_site/esercizi/fis-ter-gas-005/
          google-chrome --headless=new --no-sandbox --disable-gpu --hide-scrollbars \
            --virtual-time-budget=2500 --window-size=430,3200 \
            --screenshot=expansion-browser-artifacts/gas-isochoric-mobile.png \
            http://127.0.0.1:8765/_site/esercizi/fis-ter-gas-005/

          for route in fis-ott-rif-001 fis-ott-rif-002 fis-ott-rif-003 fis-ott-rfl-001 fis-ott-spe-001; do
            google-chrome --headless=new --no-sandbox --disable-gpu --hide-scrollbars \
              --virtual-time-budget=2500 --window-size=1440,2500 \
              --screenshot="expansion-browser-artifacts/${route}-desktop.png" \
              "http://127.0.0.1:8765/_site/esercizi/${route}/"
          done
          google-chrome --headless=new --no-sandbox --disable-gpu --hide-scrollbars \
            --virtual-time-budget=2500 --window-size=430,3300 \
            --screenshot=expansion-browser-artifacts/fis-ott-rif-003-mobile.png \
            http://127.0.0.1:8765/_site/esercizi/fis-ott-rif-003/
          google-chrome --headless=new --no-sandbox --disable-gpu --hide-scrollbars \
            --virtual-time-budget=2500 --window-size=430,3300 \
            --screenshot=expansion-browser-artifacts/fis-ott-spe-001-mobile.png \
            http://127.0.0.1:8765/_site/esercizi/fis-ott-spe-001/
      - name: Upload expansion browser artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: expansion-browser-review
          path: expansion-browser-artifacts/
          if-no-files-found: error
