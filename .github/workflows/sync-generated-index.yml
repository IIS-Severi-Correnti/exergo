name: Sync generated index

on:
  push:
    branches:
      - agent/rotational-platform-reuse-v2

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: agent/rotational-platform-reuse-v2

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Regenerate exercise index
        run: python scripts/genera_indice.py

      - name: Commit exact generated index when needed
        run: |
          set -euo pipefail
          if git diff --quiet -- metadata/indice_esercizi.csv; then
            echo "Generated index is already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metadata/indice_esercizi.csv
          git commit -m "chore: sync generated exercise index"
          git push origin HEAD:agent/rotational-platform-reuse-v2
