name: Update ray optics docs

on:
  push:
    branches:
      - feature/ray-optics-engine-v1
    paths:
      - .github/workflows/update-ray-optics-docs.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/ray-optics-engine-v1
      - name: Patch documentation
        run: |
          python - <<'PY'
          from pathlib import Path

          readme = Path('simulazioni/README.md')
          text = readme.read_text(encoding='utf-8')
          old_tree = "|   |-- dc_circuit/\n|   -- calorimetry/\n"
          new_tree = "|   |-- dc_circuit/\n|   |-- calorimetry/\n|   -- ray_optics/\n"
          if old_tree not in text:
              raise SystemExit('README engine tree anchor missing')
          text = text.replace(old_tree, new_tree, 1)

          anchor = "## Associare una simulazione a un esercizio\n"
          optics = '''### `ray_optics`\n\nServe tutti i cinque esercizi di ottica geometrica presenti nell'archivio con cinque modelli:\n\n- `single_interface_refraction`: indice ricavato dalla velocità della luce nel mezzo;\n- `snell_refraction`: legge di Snell e velocità nel secondo mezzo;\n- `parallel_slab`: rifrazione in una lastra a facce parallele e spostamento laterale;\n- `total_internal_reflection`: condizione limite e massimo indice compatibile con riflessione totale;\n- `concave_mirror`: costruzione paraassiale dei raggi e immagine virtuale in uno specchio concavo.\n\nIl motore distingue sweep fisici e costruzioni geometriche. Nei primi tre modelli il cursore varia una grandezza fisica fino ai dati reali dell'esercizio; per riflessione totale e specchio il cursore rivela invece una costruzione, senza fingere che rappresenti il tempo. Il caso limite della riflessione totale è trattato esplicitamente: a `n2,max` il raggio rifratto è radente (`r=90°`); la riflessione totale vera si ha per indici inferiori.\n\n'''
          if anchor not in text:
              raise SystemExit('README association anchor missing')
          text = text.replace(anchor, optics + anchor, 1)
          text = text.replace('inclusi circuiti,\ncalorimetria e i cinque modelli del motore gas.', 'inclusi circuiti,\ncalorimetria, gas perfetti e ottica geometrica.')
          text = text.replace('Exergo pubblica **27 esercizi di Fisica\ncon simulazione** attraverso **6 engine**.', 'Exergo pubblica **32 esercizi di Fisica\ncon simulazione** attraverso **7 engine**.')
          readme.write_text(text, encoding='utf-8')

          roadmap = Path('docs/SIMULATION_ROADMAP.md')
          text = roadmap.read_text(encoding='utf-8')
          replacements = {
              '| `implemented` | 27 |': '| `implemented` | 32 |',
              '| `planned` | 26 |': '| `planned` | 21 |',
              '- `calorimetry` — 5 esercizi, 5 modelli.': '- `calorimetry` — 5 esercizi, 5 modelli;\n- `ray_optics` — 5 esercizi, 5 modelli.',
              '## Backlog dopo il completamento dei gas perfetti': '## Backlog dopo il completamento dell\'ottica geometrica',
              '| 1 | `ray_optics` | nuovo engine | 5 | 5 | 4 | 6.25 | Snell, riflessione totale, lastra parallela e specchio concavo |\n| 2 | `wave_1d` |': '| 1 | `wave_1d` |',
              '| 3 | `newtonian_particle` |': '| 2 | `newtonian_particle` |',
              '| 4 | `electrostatics_2d` |': '| 3 | `electrostatics_2d` |',
              '| 5 | `magnetic_interaction_2d` |': '| 4 | `magnetic_interaction_2d` |',
              '| 6 | `electromagnetic_induction` |': '| 5 | `electromagnetic_induction` |',
              '| 7 | `one_dimensional_collision` |': '| 6 | `one_dimensional_collision` |',
              '| 8 | `piecewise_mechanics` |': '| 7 | `piecewise_mechanics` |',
              '| 9 | `fluid_statics` |': '| 8 | `fluid_statics` |',
              '| 10 | `thermal_expansion` |': '| 9 | `thermal_expansion` |',
              '| 11 | `momentum_system` |': '| 10 | `momentum_system` |',
              '| 12 | `heat_engine` |': '| 11 | `heat_engine` |',
              '- `ideal_gas_process` per tutti i sei esercizi attuali.': '- `ideal_gas_process` per tutti i sei esercizi attuali;\n- `ray_optics` per tutti i cinque esercizi di ottica attuali.',
              '1. `ray_optics`;\n2. `wave_1d`;\n3. `newtonian_particle`;\n4. completare `fluid_statics` con `orifice_outflow`.': '1. `wave_1d`;\n2. `newtonian_particle`;\n3. completare `fluid_statics` con `orifice_outflow`.',
              'Il traguardo **27/58** non conclude la roadmap: chiude però l\'intero dominio dei\ngas perfetti presente oggi nell\'archivio e sposta la priorità di Fase A verso\nottica geometrica, onde e dinamica newtoniana.': 'Il traguardo **32/58** non conclude la roadmap: chiude però sia il dominio dei gas perfetti sia l\'intero dominio di ottica geometrica presente oggi nell\'archivio e sposta la priorità di Fase A verso onde e dinamica newtoniana.'
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit('Roadmap anchor missing: ' + old[:70])
              text = text.replace(old, new, 1)

          optics_section = '''\n## `ray_optics`: copertura corrente\n\nL'engine serve tutti i cinque esercizi di ottica geometrica con cinque modelli indipendenti ma una sola infrastruttura SVG.\n\n- `single_interface_refraction` — `FIS-OTT-RIF-001`: da una velocità ridotta del 33% ricava `v=0,67c` e `n≈1,493`, senza introdurre un angolo di incidenza assente dal testo.\n- `snell_refraction` — `FIS-OTT-RIF-002`: dagli angoli reali `63°` e `47°` ricava `n2≈1,218` e `v≈2,46×10^8 m/s`; lo sweep dell'angolo mantiene fissi i due mezzi.\n- `parallel_slab` — `FIS-OTT-RIF-003`: usa `i=30°`, `n=1,52` e `s=6,00 mm`, ottenendo `r≈19,2°` e spostamento laterale `d≈1,19 mm`; il raggio emergente resta parallelo all'incidente.\n- `total_internal_reflection` — `FIS-OTT-RFL-001`: con acqua `n1=1,333` e `i=75°` ricava il limite `n2,max≈1,288`. Al valore massimo il rifratto è radente; per valori inferiori si ha riflessione totale.\n- `concave_mirror` — `FIS-OTT-SPE-001`: nel regime paraassiale, `f=12 cm` e `M=+3` danno `p=8 cm` e `q=-24 cm`; il playback rivela i raggi principali e le estensioni che individuano l'immagine virtuale diritta.\n\nNessuno dei cinque modelli usa dati numerici inventati per ottenere il risultato dell'esercizio. Dove il cursore rappresenta una costruzione, la nota didattica lo dichiara esplicitamente come ordine di visualizzazione e non come tempo di propagazione.\n'''
          marker = '\n## `fluid_statics`: copertura corrente\n'
          if marker not in text:
              raise SystemExit('Roadmap fluid anchor missing')
          text = text.replace(marker, optics_section + marker, 1)
          roadmap.write_text(text, encoding='utf-8')
          PY
      - name: Remove workflow and commit
        run: |
          set -euo pipefail
          rm .github/workflows/update-ray-optics-docs.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/update-ray-optics-docs.yml simulazioni/README.md docs/SIMULATION_ROADMAP.md
          git commit -m 'Document completed ray optics domain'
          git push origin HEAD:feature/ray-optics-engine-v1
