<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <title>Exergo fluid statics smoke test</title>
  <link rel="stylesheet" href="../../_site/assets/style.css">
  <link rel="stylesheet" href="../../_site/assets/simulazioni/core/simulation.css">
  <link rel="stylesheet" href="../../_site/assets/simulazioni/engines/fluid_statics/style.css">
</head>
<body>
  <main class="page">
    <p id="result">RUNNING</p>

    <section class="simulation-shell">
      <h2>Stevino numerico</h2>
      <div id="fluid-pilot" data-exergo-simulation
        data-simulation-engine="fluid_statics"
        data-simulation-config="../../_site/assets/simulazioni/config/FIS-FLU-PID-001.json">
        <p data-simulation-error hidden></p>
      </div>
    </section>

    <section class="simulation-shell">
      <h2>Stevino teorico</h2>
      <div id="fluid-reuse" data-exergo-simulation
        data-simulation-engine="fluid_statics"
        data-simulation-config="../../_site/assets/simulazioni/config/FIS-FLU-PID-002.json">
        <p data-simulation-error hidden></p>
      </div>
    </section>

    <section class="simulation-shell">
      <h2>Archimede numerico</h2>
      <div id="floating-pilot" data-exergo-simulation
        data-simulation-engine="fluid_statics"
        data-simulation-config="../../_site/assets/simulazioni/config/FIS-FLU-ARC-001.json">
        <p data-simulation-error hidden></p>
      </div>
    </section>

    <section class="simulation-shell">
      <h2>Archimede teorico</h2>
      <div id="floating-reuse" data-exergo-simulation
        data-simulation-engine="fluid_statics"
        data-simulation-config="../../_site/assets/simulazioni/config/FIS-FLU-ARC-003.json">
        <p data-simulation-error hidden></p>
      </div>
    </section>
  </main>

  <script type="module" src="../../_site/assets/simulazioni/core/runtime.js"></script>
  <script>
    const result = document.querySelector("#result");
    const pilot = document.querySelector("#fluid-pilot");
    const reuse = document.querySelector("#fluid-reuse");
    const floatingPilot = document.querySelector("#floating-pilot");
    const floatingReuse = document.querySelector("#floating-reuse");
    const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    function finish(status, details) {
      result.textContent = status + ": " + details;
      result.dataset.status = status;
      document.title = status + " - Exergo fluid statics smoke test";
    }

    function close(actual, expected, tolerance = 1e-8) {
      if (Math.abs(actual - expected) > tolerance) {
        throw new Error(actual + " != " + expected);
      }
    }

    function dispatchInput(control, value) {
      control.value = String(value);
      control.dispatchEvent(new Event("input", { bubbles: true }));
    }

    const deadline = Date.now() + 7000;
    const checkReady = window.setInterval(() => {
      const containers = [pilot, reuse, floatingPilot, floatingReuse];
      if (containers.some((item) => item?.dataset.simulationReady !== "true")) {
        if (Date.now() > deadline) {
          window.clearInterval(checkReady);
          finish("FAIL", "inizializzazione scaduta");
        }
        return;
      }

      window.clearInterval(checkReady);
      try {
        const pilotPlay = pilot.querySelector('[data-simulation-action="play"]');
        const pilotPause = pilot.querySelector('[data-simulation-action="pause"]');
        const pilotReset = pilot.querySelector('[data-simulation-action="reset"]');
        const pilotSlider = pilot.querySelector('[data-simulation-action="set_progress"]');
        const pilotDensity = pilot.querySelector('[data-simulation-action="set_density"]');
        const pilotWater1 = pilot.querySelector('[data-vessel="1"] [data-water]');
        const pilotWater2 = pilot.querySelector('[data-vessel="2"] [data-water]');

        close(Number(pilot.dataset.pressure1Pa), 1960);
        close(Number(pilot.dataset.pressure2Pa), 1960);
        close(Number(pilot.dataset.pressureRatio), 1);
        if (!pilotDensity.hidden) throw new Error("densita modificabile nel pilot Stevino");
        if (!(Number(pilotWater2.getAttribute("width")) > Number(pilotWater1.getAttribute("width")))) {
          throw new Error("raggi Stevino non distinti");
        }
        if (pilotPlay.disabled !== reducedMotion || !pilotPause.disabled) {
          throw new Error("semantica Play/Pausa Stevino");
        }
        dispatchInput(pilotSlider, 1000);
        close(Number(pilot.dataset.depth2M), 0.4);
        close(Number(pilot.dataset.pressure2Pa), 3920);
        close(Number(pilot.dataset.pressureRatio), 2);
        if (pilot.dataset.targetReached !== "true") throw new Error("target Stevino 2:1");
        pilotReset.click();
        close(Number(pilot.dataset.depth2M), 0.2);

        const reuseSlider = reuse.querySelector('[data-simulation-action="set_progress"]');
        const reuseDensity = reuse.querySelector('[data-simulation-action="set_density"]');
        const reuseNote = reuse.querySelector('[data-exploration-note]');
        if (reuseDensity.hidden || reuseNote.hidden) throw new Error("Stevino teorico non esplorabile");
        dispatchInput(reuseDensity, 1200);
        close(Number(reuse.dataset.pressure1Pa), 1176);
        close(Number(reuse.dataset.pressure2Pa), 588);
        dispatchInput(reuseSlider, 1000);
        close(Number(reuse.dataset.pressureRatio), 4);
        reuse.querySelector('[data-simulation-action="reset"]').click();

        const floatingSlider = floatingPilot.querySelector('[data-simulation-action="set_progress"]');
        const floatingDensity = floatingPilot.querySelector('[data-simulation-action="set_body_density"]');
        const floatingPlay = floatingPilot.querySelector('[data-simulation-action="play"]');
        const floatingPause = floatingPilot.querySelector('[data-simulation-action="pause"]');
        if (!floatingDensity.hidden) throw new Error("densita cassa numerica modificabile");
        if (floatingPlay.disabled !== reducedMotion || !floatingPause.disabled) {
          throw new Error("semantica Play/Pausa Archimede");
        }
        close(Number(floatingPilot.dataset.submergedFraction), 0);
        close(Number(floatingPilot.dataset.equilibriumFraction), 0.48);
        close(Number(floatingPilot.dataset.bodyDensityKgM3), 480);
        if (floatingPilot.dataset.floatingRegime !== "floating") throw new Error("regime iniziale cassa");
        dispatchInput(floatingSlider, 480);
        close(Number(floatingPilot.dataset.submergedFraction), 0.48);
        close(Number(floatingPilot.dataset.buoyancyWeightRatio), 1);
        if (floatingPilot.dataset.targetReached !== "true") throw new Error("equilibrio 48% non riconosciuto");
        if (!floatingPilot.querySelector('[data-simulation-status]').textContent.includes("Equilibrio raggiunto")) {
          throw new Error("feedback equilibrio cassa mancante");
        }
        const weight = floatingPilot.querySelector('[data-force-weight]');
        const buoyancy = floatingPilot.querySelector('[data-force-buoyancy]');
        const weightLength = Math.abs(Number(weight.getAttribute("y2")) - Number(weight.getAttribute("y1")));
        const buoyancyLength = Math.abs(Number(buoyancy.getAttribute("y2")) - Number(buoyancy.getAttribute("y1")));
        close(weightLength, buoyancyLength, 0.05);
        floatingPilot.querySelector('[data-simulation-action="reset"]').click();
        close(Number(floatingPilot.dataset.submergedFraction), 0);

        const floatingReuseSlider = floatingReuse.querySelector('[data-simulation-action="set_progress"]');
        const floatingReuseDensity = floatingReuse.querySelector('[data-simulation-action="set_body_density"]');
        const floatingReuseNote = floatingReuse.querySelector('[data-exploration-note]');
        if (floatingReuseDensity.hidden || floatingReuseNote.hidden) {
          throw new Error("Archimede teorico non esplorabile");
        }
        if (!floatingReuseNote.textContent.includes("non sono dati del quesito")) {
          throw new Error("nota valori esplorativi Archimede mancante");
        }
        close(Number(floatingReuse.dataset.equilibriumFraction), 0.6);
        dispatchInput(floatingReuseSlider, 600);
        close(Number(floatingReuse.dataset.buoyancyWeightRatio), 1);
        if (floatingReuse.dataset.targetReached !== "true") throw new Error("equilibrio 60% teorico");

        dispatchInput(floatingReuseDensity, 1000);
        dispatchInput(floatingReuseSlider, 1000);
        if (floatingReuse.dataset.floatingRegime !== "neutral") throw new Error("regime neutro non riconosciuto");
        close(Number(floatingReuse.dataset.buoyancyWeightRatio), 1);
        if (floatingReuse.dataset.targetReached !== "true") throw new Error("equilibrio neutro non riconosciuto");

        dispatchInput(floatingReuseDensity, 1200);
        if (floatingReuse.dataset.floatingRegime !== "sinking") throw new Error("affondamento non riconosciuto");
        close(Number(floatingReuse.dataset.buoyancyWeightRatio), 1000 / 1200);
        if (floatingReuse.dataset.equilibriumFraction !== "") throw new Error("equilibrio impossibile dovrebbe essere vuoto");
        if (floatingReuse.dataset.targetReached !== "false") throw new Error("target falso in affondamento");
        if (!floatingReuse.querySelector('[data-simulation-status]').textContent.includes("affonda")) {
          throw new Error("feedback affondamento mancante");
        }
        floatingReuse.querySelector('[data-simulation-action="reset"]').click();
        close(Number(floatingReuse.dataset.bodyDensityKgM3), 600);
        close(Number(floatingReuse.dataset.submergedFraction), 0);

        if (document.documentElement.scrollWidth > window.innerWidth + 1) {
          throw new Error(
            "overflow orizzontale " + document.documentElement.scrollWidth +
            "px su viewport " + window.innerWidth + "px"
          );
        }

        finish(
          "PASS",
          "Stevino + Archimede, 48%, regimi floating/neutral/sinking, reset, reduced motion=" + reducedMotion
        );
      } catch (error) {
        finish("FAIL", error.message);
      }
    }, 25);
  </script>
</body>
</html>
