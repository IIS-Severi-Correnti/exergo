name: Sync apparent-weight milestone

on:
  push:
    branches:
      - agent/fluid-statics-apparent-weight

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: agent/fluid-statics-apparent-weight

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Synchronize metadata and roadmap
        run: |
          python scripts/sync_apparent_weight_milestone.py
          python scripts/genera_indice.py
          git checkout -- .github/workflows/validate.yml

      - name: Commit synchronized milestone files
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metadata/simulation_coverage.csv metadata/indice_esercizi.csv docs/SIMULATION_ROADMAP.md
          if git diff --cached --quiet; then
            echo "Milestone files already synchronized"
            exit 0
          fi
          git commit -m "chore: sync apparent-weight coverage and roadmap"
          git push origin HEAD:agent/fluid-statics-apparent-weight
