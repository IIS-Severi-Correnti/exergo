name: Apply pressure-points milestone

on:
  push:
    branches:
      - agent/fluid-statics-pressure-points

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: agent/fluid-statics-pressure-points

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Apply deterministic milestone patch
        run: python scripts/apply_pressure_points_milestone.py

      - name: Commit patched files
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            simulazioni/engines/fluid_statics/engine.js \
            simulazioni/engines/fluid_statics/manifest.json \
            simulazioni/engines/fluid_statics/multi_view.js \
            simulazioni/engines/fluid_statics/style.css \
            esercizi/fisica/fluidostatica/pressione_idrostatica/FIS-FLU-PID-003.tex \
            tests/test_fluid_statics_config.py \
            tests/test_site_generation.py
          if git diff --cached --quiet; then
            echo "Pressure-points files already patched"
            exit 0
          fi
          git commit -m "feat: add hydrostatic pressure-points model"
          git push origin HEAD:agent/fluid-statics-pressure-points
