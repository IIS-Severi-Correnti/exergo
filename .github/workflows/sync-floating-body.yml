name: Sync floating-body generated metadata

on:
  push:
    branches:
      - agent/fluid-statics-floating-body

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: agent/fluid-statics-floating-body

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Promote floating-body coverage entries
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("metadata/simulation_coverage.csv")
          text = path.read_text(encoding="utf-8")
          replacements = {
              'FIS-FLU-ARC-001,planned,fluid_statics,floating_body,P0,':
                  'FIS-FLU-ARC-001,implemented,fluid_statics,floating_body,P0,',
              'FIS-FLU-ARC-003,planned,fluid_statics,floating_body,P1,':
                  'FIS-FLU-ARC-003,implemented,fluid_statics,floating_body,P1,',
          }
          for before, after in replacements.items():
              if before not in text:
                  raise SystemExit(f"coverage row non trovata: {before}")
              text = text.replace(before, after, 1)
          path.write_text(text, encoding="utf-8")
          PY

      - name: Regenerate exercise index
        run: python scripts/genera_indice.py

      - name: Commit synchronized metadata
        run: |
          set -euo pipefail
          if git diff --quiet -- metadata/simulation_coverage.csv metadata/indice_esercizi.csv; then
            echo "Metadata already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metadata/simulation_coverage.csv metadata/indice_esercizi.csv
          git commit -m "chore: sync floating-body coverage and index"
          git push origin HEAD:agent/fluid-statics-floating-body
