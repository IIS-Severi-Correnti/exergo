name: Apply hydraulic-press milestone

on:
  push:
    branches:
      - agent/fluid-statics-hydraulic-press

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: agent/fluid-statics-hydraulic-press

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Apply deterministic milestone patch
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/apply_hydraulic_press_milestone.py")
          text = path.read_text(encoding="utf-8")
          old = "    if count != 1:\n        raise RuntimeError(f\"{path}: expected exactly one occurrence, found {count}: {old[:80]!r}\")\n"
          new = "    if count < 1:\n        raise RuntimeError(f\"{path}: expected at least one occurrence, found {count}: {old[:80]!r}\")\n"
          if old not in text:
              raise SystemExit("replace_once guard not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          python scripts/apply_hydraulic_press_milestone.py
          python scripts/genera_indice.py

      - name: Commit patched files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            esercizi/fisica/fluidostatica/torchio_idraulico/FIS-FLU-PAS-001.tex \
            simulazioni/config/FIS-FLU-PAS-001.json \
            simulazioni/engines/fluid_statics/engine.js \
            simulazioni/engines/fluid_statics/manifest.json \
            simulazioni/engines/fluid_statics/multi_view.js \
            simulazioni/engines/fluid_statics/hydraulic_press_view.js \
            simulazioni/engines/fluid_statics/style.css \
            tests/js/fluid_statics_hydraulic_press.test.mjs \
            tests/test_hydraulic_press_config.py \
            tests/test_hydraulic_press_site.py \
            tests/test_fluid_statics_config.py \
            tests/test_site_generation.py \
            tests/browser/hydraulic_press_smoke.html \
            metadata/indice_esercizi.csv \
            metadata/simulation_coverage.csv \
            docs/SIMULATION_ROADMAP.md
          git commit -m "feat: add hydraulic press model"
          git push origin HEAD:agent/fluid-statics-hydraulic-press
