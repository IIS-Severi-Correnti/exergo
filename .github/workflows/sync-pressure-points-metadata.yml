name: Sync pressure-points metadata

on:
  push:
    branches:
      - agent/fluid-statics-pressure-points

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: agent/fluid-statics-pressure-points

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Synchronize coverage roadmap and index
        run: |
          python scripts/sync_pressure_points_metadata.py
          python scripts/genera_indice.py

      - name: Commit synchronized metadata
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metadata/simulation_coverage.csv metadata/indice_esercizi.csv docs/SIMULATION_ROADMAP.md
          if git diff --cached --quiet; then
            echo "Pressure-points metadata already synchronized"
            exit 0
          fi
          git commit -m "chore: sync pressure-points coverage and roadmap"
          git push origin HEAD:agent/fluid-statics-pressure-points
